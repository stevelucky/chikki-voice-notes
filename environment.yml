name: chikki
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.13
  - numpy>=1.26
  - pip
  - pip:
    # Audio
    - sounddevice>=0.5.0
    - soundfile>=0.13.0
    # Transcription
    - mlx-whisper>=0.4.0
    - parakeet-mlx>=0.2.0
