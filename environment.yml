name: scribe
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.13
  - numpy>=1.26
  - pip
  - pip:
    # Audio
    - sounddevice>=0.5.0
    - soundfile>=0.13.0
    # Transcription
    - mlx-whisper>=0.4.0
    - parakeet-mlx>=0.2.0
    # - pyannote.audio>=3.1.0  # uncomment if using diarization
    # LLM providers
    - google-genai>=1.0.0
    - openai>=1.0.0
    - anthropic>=0.40.0
    # macOS menu bar
    - rumps>=0.4.0
    # Config + CLI
    - pyyaml>=6.0
    - click>=8.1.0
    # MCP server (mcp_server.py)
    - mcp>=1.0.0
    # Web front end (web/app.py)
    - fastapi>=0.110
    - uvicorn[standard]>=0.27
    - jinja2>=3.1
    - python-multipart>=0.0.9
    - markdown>=3.5
    - dateparser>=1.2
    # Dev / tests
    - pytest>=8.0
