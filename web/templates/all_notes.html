{% extends "base.html" %}
{% block content %}

  <header class="mb-5">
    <p class="font-mono text-xs uppercase tracking-[.12em] text-ink-faint">
      {{ notes|length }} note{{ '' if notes|length == 1 else 's' }}
    </p>
    <h1 class="mt-1 font-display text-4xl font-semibold tracking-tight text-ink">All Notes</h1>
  </header>

  <form class="mb-5">
    <div class="relative">
      <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-ink-faint" width="16" height="16"
           viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>
      </svg>
      <input type="search" name="q" value="{{ q }}" placeholder="Search notes by title, topic, or content…"
             class="w-full rounded-lg border border-line pl-9 pr-3 py-2.5 text-sm bg-surface
                    focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent/40"
             hx-get="/notes/list" hx-target="#notes-list"
             hx-trigger="keyup changed delay:300ms, search">
    </div>
  </form>

  <div id="notes-list">
    {% include "_notes_list.html" %}
  </div>

{% endblock %}
