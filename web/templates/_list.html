{% if groups %}
  {% for g in groups %}
  <section class="mb-5 bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
    <div class="px-4 py-3 border-b border-slate-100 flex items-baseline justify-between gap-3">
      <h2 class="font-semibold text-slate-900 truncate">{{ g.note_title }}</h2>
      <span class="text-xs text-slate-400 whitespace-nowrap">{{ g.note_date }}</span>
    </div>
    <ul class="divide-y divide-slate-100">
      {% for item in g['items'] %}
        {% include "_item.html" %}
      {% endfor %}
    </ul>
  </section>
  {% endfor %}
{% else %}
  <div class="text-center text-slate-400 py-20 text-lg">{% if bucket == 'done' %}No completed items yet.{% else %}No open action items 🎉{% endif %}</div>
{% endif %}
